name: Update exchange rate

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exchange-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run exchange-rate check
        run: ./check.sh

      - name: Fetch and append today's SUNAT rate
        env:
          XR_CSV: ${{ github.workspace }}/history.csv
        run: ./xr 100 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push CSV update
        run: |
          git diff --quiet -- history.csv && exit 0

          git add history.csv
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update exchange rate"
          git push
